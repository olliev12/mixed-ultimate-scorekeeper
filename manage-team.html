<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Team - Starfire Ultimate</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <h1>Manage Team</h1>
        <nav>
            <a href="index.html"><button>Home</button></a>
            <button id="addPlayerBtn">Add Player</button>
        </nav>
    </header>
    <main>
        <h2 class="inline-header">Current Players</h2>
        
        <ul id="playerList">
            <!-- Player list will be populated here -->
        </ul>

        

        <!-- Add Player Popup -->
        <div id="addPlayerPopup" class="modal">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <h2>Add New Player</h2>
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName"><br><br>

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName"><br><br>

                <label for="nickname">Nickname/Display Name*:</label>
                <input type="text" id="nickname" required><br><br>

                <label for="genderMatch">Gender Match:</label>
                <select id="genderMatch" required>
                    <option value="M">DoM</option>
                    <option value="W">DoW</option>
                </select><br><br>

                <label for="position">Position:</label>
                <select id="position" required>
                    <option value="H">Handler</option>
                    <option value="C">Cutter</option>
                    <option value="F">Flex</option>
                </select><br><br>

                <label for="playerLine">Line:</label>
                <select id="playerLine" required>
                    <option value="O">O</option>
                    <option value="D">D</option>
                    <option value="X">X</option>
                </select><br><br>

                <button id="savePlayerBtn">Save Player</button>
            </div>
        </div>
    </main>

    <script src="scripts/manage-team.js"></script>
    <script src="scripts/data-manager.js"></script>
</body>
</html>
